spring.application.name=e-commerce
server.port=8082
spring.jackson.deserialization.fail-on-null-for-primitives=false

# MongoDB (override in application-local.properties for local credentials)
spring.data.mongodb.uri=mongodb://localhost:27017/ecommerce

# JWT Security (override app.jwt.secret in production / application-local.properties)
app.jwt.secret=e-commerce-super-secret-jwt-key-change-in-production-2026-256bit
app.jwt.expiration-ms=86400000

# Default Admin account seeded on startup if not present
app.admin.email=admin@ecommerce.com
app.admin.password=Admin@123
app.admin.full-name=System Administrator
